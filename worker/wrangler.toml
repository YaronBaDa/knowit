# KNOWIT anonymous score aggregation worker
#   wrangler kv namespace create STATS   -> paste the id below
#   wrangler deploy
name = "knowit-stats"
main = "index.js"
compatibility_date = "2026-11-01"

# KV is eventually consistent; a lost increment just nudges a percentage. Fine here.
[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
